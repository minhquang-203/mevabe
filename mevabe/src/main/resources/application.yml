server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: mevabe-shop-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mevabe_shop}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER:mevabe}
    password: ${DB_PASSWORD:mevabe123}
    hikari:
      pool-name: mevabe-pool
      maximum-pool-size: 10

  # Flyway: tu dong chay migration trong classpath:db/migration khi khoi dong
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Neu DB da co san bang (chua co lich su Flyway) thi baseline thay vi bao loi.
    # baseline-version=1 -> DB da ton tai san se duoc danh dau "da o V1" (bo qua chay lai).
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Schema do file SQL quan ly, KHONG de Hibernate tu tao/sua bang
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # Redis chi thuc su ket noi khi app.cache.provider=redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Kafka chi thuc su ket noi khi app.messaging.provider=kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: mevabe-shop
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ==== Cong tac bat/tat ha tang: doi 1 dong la doi cong nghe ====
app:
  cache:
    # memory (mac dinh) | redis
    provider: ${APP_CACHE_PROVIDER:memory}
    ttl-seconds: 300
  messaging:
    # log (mac dinh) | kafka
    provider: ${APP_MESSAGING_PROVIDER:log}
    topic-prefix: mevabe
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-please-this-is-a-very-long-dev-secret-key-1234567890}
      access-token-minutes: 60
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# ==== Swagger / OpenAPI ====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# ==== Actuator ====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    # Mac dinh dung cache bo nho -> tat health-check Redis de khong bao DOWN sai.
    # Khi bat Redis that, doi thanh true neu muon giam sat.
    redis:
      enabled: false

logging:
  level:
    vn.mevabe.shop: INFO
